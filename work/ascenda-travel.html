<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building a better flight search experience | Celena Jasmin, Product Designer</title>
    <link href="../css/style.css" rel="stylesheet">
    <link href="../images/favicon.png" rel="shortcut icon" type="image/x-icon">
    <link href="../images/webclip.png" rel="apple-touch-icon">
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      nav {
        margin: 0 -20px;
      }
      .locked-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;
        max-width: 560px;
        margin: 0 auto;
      }
      .lock-icon {
        font-size: 48px;
        margin-bottom: 24px;
      }
      .copy-email {
        cursor: pointer;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-decoration-color: rgba(0,0,0,0.3);
        background: none;
        border: none;
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: inherit;
        padding: 0;
      }
      .copy-email:hover {
        color: #716552;
      }
      .copy-feedback {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px;
        color: #716552;
        margin-top: 8px;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 0.25s ease, transform 0.25s ease;
        height: 20px;
      }
      .copy-feedback.visible {
        opacity: 1;
        transform: translateY(0);
      }
      @media (max-width: 769px) {
        nav {
          padding-left: 20px;
          padding-right: 20px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="../index.html">CELENA JASMIN</a></li>
        <li>
          <a href="mailto:celenajasmin@gmail.com">celenajasmin@gmail.com</a>
        </li>
      </ul>
    </nav>
    <main>
      <div class="locked-container">
        <div class="lock-icon">🔒</div>
        <h1>This case study is locked</h1>
        <p>Reach out to me at <button class="copy-email" onclick="copyEmail(this)">celenajasmin@gmail.com</button> to get access.</p>
        <div class="copy-feedback" id="copy-feedback">Copied to clipboard</div>
        <br>
        <p><a href="../index.html">Back to all projects</a></p>
      </div>
    </main>
    <script>
      function copyEmail(btn) {
        navigator.clipboard.writeText('celenajasmin@gmail.com').then(function() {
          var feedback = document.getElementById('copy-feedback');
          feedback.classList.add('visible');
          setTimeout(function() { feedback.classList.remove('visible'); }, 2000);
        });
      }
    </script>
  </body>
</html>
